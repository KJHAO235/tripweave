name: 測試並部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只保留一個部署，新的 push 會取消還在排隊的舊部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: 加入鐵路資料
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download rail-data --pattern rail-data.tar.gz --dir "$RUNNER_TEMP"; then
            mkdir -p dist/rail
            tar -xzf "$RUNNER_TEMP/rail-data.tar.gz" -C dist/rail
            ls dist/rail
          else
            echo "尚無鐵路資料，這次部署不含補路功能"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
